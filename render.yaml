# Render Blueprint — deploy via https://dashboard.render.com/blueprints
# "New +" → "Blueprint" → point at this repo → Render reads this file.
#
# After creation, set the real secret values in Render's dashboard under
# this service → Environment. sync: false below means Render will prompt
# you for them at deploy time instead of expecting them in this file —
# never put real keys in this file, it gets committed to git.
services:
  - type: web
    name: appointed-time-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER_EMAIL
        sync: false
      - key: NOTIFY_EMAIL_1
        sync: false
      - key: NOTIFY_EMAIL_2
        sync: false
      - key: APPROVAL_NOTIFY_EMAILS
        sync: false
      - key: APPROVAL_CC_EMAILS
        sync: false
      - key: SCHEDULER_NOTIFY_EMAILS
        sync: false
      - key: WAREHOUSE_NOTIFY_EMAILS
        sync: false
      - key: FINANCE_NOTIFY_EMAILS
        sync: false
      - key: DEPT_EMAILS_PRESS
        sync: false
      - key: DEPT_EMAILS_GARMENT
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
